backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPO-NAME   # change this (see README)
  branch: main
  # With Netlify: Site configuration > Access & security > OAuth, install GitHub provider. No base_url needed.
  # With Vercel or anywhere else: add  base_url: https://YOUR-OAUTH-PROXY  here (see README).

media_folder: content/images
public_folder: /images
site_url: /
display_url: /
locale: en

collections:
  - name: site
    label: Website
    files:
      - name: content
        label: All page text and photos
        file: content/site.json
        fields:
          - label: Search and sharing
            name: settings
            widget: object
            collapsed: true
            fields:
              - { label: Page title (browser tab, Google), name: meta_title, widget: string }
              - { label: Page description (Google, link previews), name: meta_description, widget: text }
          - label: Show or hide sections
            name: visibility
            widget: object
            collapsed: false
            hint: Switch a section off to remove it from the page (and its menu link). Switch it on again any time. Your text is kept.
            fields:
              - { label: Scrolling words strip, name: marquee, widget: boolean, default: true }
              - { label: Services, name: services, widget: boolean, default: true }
              - { label: Selected work, name: work, widget: boolean, default: true }
              - { label: Approach (Brand and Performance circles), name: approach, widget: boolean, default: true }
              - { label: How it works (twelve weeks), name: method, widget: boolean, default: true }
              - { label: Client quotes (In their words), name: words, widget: boolean, default: true }
              - { label: About, name: about, widget: boolean, default: true }
          - label: Photos
            name: photos
            widget: object
            collapsed: false
            hint: Add a photo to replace the generated picture. Leave empty to keep the original.
            fields:
              - label: "About photo (shows above the business cards)"
                name: about
                widget: object
                collapsed: true
                fields:
                  - { label: Image, name: image, widget: image, required: false }
